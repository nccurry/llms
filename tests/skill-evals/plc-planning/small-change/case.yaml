schema_version: 1
skill: plc-planning
description: The user asks for a durable plan for a small, bounded change. The plan must be one file, plc-<slug>.md in planned/, in the shared PLC template, with no SRD, SADD or implementation plan, and no code changes.
setup: python fixture/build.py <dest>
working_directory: <dest>/harbor
prompt: |
  `harbor list --limit 0` prints nothing, and a negative limit quietly drops
  berths from the end of the list. It should fail with a clear error when the
  limit is below 1. It's a small change, just the argument check and a test,
  but I won't get to it this week. Write up a plan for it and save it with our
  other plans, so whoever picks it up has what they need. Don't change the
  code yet. I'm @alex; put me down as the owner.
max_turns: 30
check: python ../check_plan.py <dest>
graders:
  - graders/outcome.md
