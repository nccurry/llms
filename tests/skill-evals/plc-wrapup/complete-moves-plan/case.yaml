schema_version: 1
skill: plc-wrapup
description: "The PLC's only phase is done on its branch. Wrapping it up completes the PLC, so the plan moves to the completed folder with the historical-record line."
setup: python fixture/build.py <dest>
working_directory: <dest>/notify
prompt: "We're done with the digest PLC. Wrap it up."
max_turns: 60
check: python ../check_wrap.py <dest>
graders:
  - graders/outcome.md
  - ../../plc-checkpoint/graders/plan-record.md
