schema_version: 1
skill: plc-wrapup
description: "The PLC's only phase passes its tests, but its branch never implemented DIG-003. Wrapping up merges P1, but must not mark it Verified while it still holds DIG-003, or complete the PLC: the gap is recorded and the plan stays open."
setup: python fixture/build.py <dest>
working_directory: <dest>/notify
prompt: "We're done with the digest PLC. Wrap it up."
max_turns: 60
check: python ../check_wrap.py <dest>
graders:
  - graders/outcome.md
  - ../../plc-checkpoint/graders/plan-record.md
