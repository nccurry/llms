schema_version: 1
skill: wrap-this-up
description: "Another session holds a worktree lock on P2. Only P1 can be merged and cleaned up; the PLC stays open."
setup: python fixture/build.py <dest>
working_directory: <dest>/notify
prompt: "Wrap up the digest PLC and merge what's ready."
max_turns: 60
check: python ../check_wrap.py <dest>
graders:
  - graders/outcome.md
