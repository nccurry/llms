schema_version: 1
skill: verify-before-claiming
description: The same required check has a failed attempt and a passing rerun with no explained difference.
setup: python fixture/build.py <dest>
working_directory: <dest>/reload
prompt: |
  Read the CI evidence in this checkout and tell me whether CONF-002 is ready
  to mark Verified. Keep this review read-only and use the recorded CI runs.
max_turns: 15
check: python ../../plc-checkpoint/check_state.py <dest> --strict
graders:
  - graders/outcome.md
