version: '3'

silent: true

tasks:
  piw:sync:
    desc: Create the Python 3.14 development environment from the lockfile.
    cmds:
      - uv sync --locked

  piw:check:
    desc: Run formatting, lint, strict typing, tests, and coverage.
    cmds:
      - uv run ruff format --check src tests/piw piw
      - uv run ruff check src tests/piw piw
      - uv run pyright
      - uv run pytest tests/piw --cov=piw --cov-report=term-missing

  piw:test:
    desc: Run piw's deterministic test suite.
    cmds:
      - uv run pytest tests/piw

  piw:build:
    desc: Build the piw source distribution and wheel.
    cmds:
      - uv build --no-sources

  skills:list:
    desc: List managed skills and resolved install targets.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --command list

  skills:validate:
    desc: Validate managed skill folder shape and metadata.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --command validate

  skills:test:
    desc: Run the installer unit tests.
    cmds:
      - python -m unittest discover -s tests -p "test_*.py"

  skills:dry-run:
    desc: Show what skill installation would change.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --target all --dry-run

  skills:dry-run:codex:
    desc: Show what the Codex skill installation would change.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --target codex --dry-run

  skills:dry-run:pi:
    desc: Show what the Pi skill installation would change.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --target pi --dry-run

  skills:install:
    desc: Install managed skills for Codex, Claude, and Pi.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --target all

  skills:install:codex:
    desc: Install managed skills for Codex only.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --target codex

  skills:install:claude:
    desc: Install managed skills for Claude only.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --target claude

  skills:install:pi:
    desc: Install managed skills for Pi only.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_install_skills.ps1 --target pi
