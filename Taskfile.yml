version: '3'

silent: true

vars:
  MISE: '"{{.ROOT_DIR}}/.tools/bin/mise{{if eq OS "windows"}}.exe{{end}}"'
  UV: '{{.MISE}} exec -- uv'
  PYTHON_VERSION:
    sh: 'cat "{{.ROOT_DIR}}/piw/.python-version"'
  LINT_BIN: '{{.ROOT_DIR}}/.tools/lint/{{if eq OS "windows"}}Scripts{{else}}bin{{end}}'
  LINT_PYTHON: '{{.LINT_BIN}}/python{{if eq OS "windows"}}.exe{{end}}'
  # lint/mise.toml pins shellcheck and PowerShell apart from mise.toml. MISE_LINT runs mise with
  # lint/ as the working directory, so it reads lint/mise.toml. MISE_CEILING_PATHS stops it
  # reading the root mise.toml above it, and its own data directory keeps these tools out of the
  # shim folder in .tools/mise/data: a mise install rebuilds every shim in the folder it uses.
  MISE_LINT: 'MISE_DATA_DIR="{{.ROOT_DIR}}/.tools/lint-mise/data" MISE_CEILING_PATHS="{{.ROOT_DIR}}" {{.MISE}} -C "{{.ROOT_DIR}}/lint"'
  PSMODULES: '{{.ROOT_DIR}}/.tools/powershell-modules'
  PS_PINS:
    sh: 'cat "{{.ROOT_DIR}}/lint/powershell-modules.json"'
  PESTER_DIR: '{{.PSMODULES}}/Pester/{{(fromJson .PS_PINS).modules.Pester.version}}'
  ANALYZER_DIR: '{{.PSMODULES}}/PSScriptAnalyzer/{{(fromJson .PS_PINS).modules.PSScriptAnalyzer.version}}'
  PYTHON: '{{.UV}} run --isolated --no-project --python "{{.PYTHON_VERSION}}" --with-requirements "{{.ROOT_DIR}}/agent-runtime.txt" python'
  TARGET: '{{default "all" .TARGET}}'
  OUTPUT: '{{default "text" .OUTPUT}}'

env:
  MISE_DATA_DIR: '{{.ROOT_DIR}}/.tools/mise/data'
  MISE_CACHE_DIR: '{{.ROOT_DIR}}/.tools/mise/cache'
  MISE_CONFIG_DIR: '{{.ROOT_DIR}}/.tools/mise/config'
  MISE_STATE_DIR: '{{.ROOT_DIR}}/.tools/mise/state'
  MISE_SYSTEM_CONFIG_DIR: '{{.ROOT_DIR}}/.tools/mise/system'
  MISE_CEILING_PATHS: '{{dir .ROOT_DIR}}'
  MISE_TMP_DIR: '{{.ROOT_DIR}}/.tools/tmp'
  UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/.tools/python'
  UV_CACHE_DIR: '{{.ROOT_DIR}}/.tools/uv-cache'
  LLMS_CALLER_CWD: '{{default .USER_WORKING_DIR .LLMS_CALLER_CWD}}'
  # Read the caller's PATH inline: a shared var resolved here to an empty PATH.
  LLMS_ORIGINAL_PATH: '{{default (env "PATH") (env "LLMS_ORIGINAL_PATH")}}'
  PATH: '{{.ROOT_DIR}}/.tools/bin{{if eq OS "windows"}};{{else}}:{{end}}{{.ROOT_DIR}}/.tools/mise/data/shims{{if eq OS "windows"}};{{default "C:/Windows" .SystemRoot}}/System32;{{default "C:/Windows" .SystemRoot}}/System32/WindowsPowerShell/v1.0;{{else}}:{{end}}{{default (env "PATH") (env "LLMS_ORIGINAL_PATH")}}'

includes:
  piw:
    taskfile: ./piw/Taskfile.yml
    dir: ./piw

tasks:
  default:
    desc: List available repository tasks.
    cmd: '{{.MISE}} exec -- task --list'

  deps:install:
    aliases: [setup]
    desc: Install pinned tools and synchronize project dependencies.
    cmds:
      - task: deps:tools
      - task: deps:runtime
      - task: piw:sync

  deps:runtime:
    desc: Prepare the uv-managed Python libraries used by setup commands.
    cmd: '{{.PYTHON}} -c "import tomlkit"'

  deps:tools:
    desc: Install the native prerequisites pinned by mise.
    preconditions:
      - sh: '{{.MISE}} --version'
        msg: Run bootstrap.sh or bootstrap.ps1 to prepare project-local mise and Task.
    cmds:
      # mise points every shim at the mise it runs from, so a checkout sharing another's data
      # directory must not install into it (see the script). Windows has no sh and copies its shims.
      - '{{if eq OS "windows"}}{{.MISE}} install --locked --yes{{else}}sh "{{.ROOT_DIR}}/scripts/ensure_mise_tools.sh" {{.MISE}} install --locked --yes{{end}}'

  deps:dev-tools:
    desc: Install the development-only tools (Python lint tools, shellcheck, PowerShell 7, Pester, PSScriptAnalyzer); not part of deps:install.
    cmds:
      - '{{.UV}} venv --clear --python "{{.PYTHON_VERSION}}" "{{.ROOT_DIR}}/.tools/lint"'
      - >-
        {{.UV}} pip install --require-hashes --python "{{.LINT_PYTHON}}"
        -r "{{.ROOT_DIR}}/lint/requirements.txt"
      - '{{.MISE_LINT}} trust --yes --quiet "{{.ROOT_DIR}}/lint/mise.toml"'
      - '{{.MISE_LINT}} install --locked --yes'
      # Each download is checked against the SHA-256 in lint/powershell-modules.json before it is unpacked.
      - '"{{.LINT_PYTHON}}" "{{.ROOT_DIR}}/lint/install_powershell_modules.py" "{{.ROOT_DIR}}/lint/powershell-modules.json" "{{.PSMODULES}}"'
      # Written last: lint:python treats a missing or different copy as a stale or half-built install.
      - 'cat "{{.ROOT_DIR}}/lint/requirements.txt" > "{{.ROOT_DIR}}/.tools/lint/requirements.txt"'

  deps:dev-tools:lock:
    desc: Regenerate lint/requirements.txt (with hashes) and lint/mise.lock after editing lint/requirements.in or lint/mise.toml.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - '{{.UV}} pip compile --generate-hashes --python-version 3.14 lint/requirements.in -o lint/requirements.txt'
      - '{{.MISE_LINT}} lock -p linux-x64,linux-arm64,macos-x64,macos-arm64,windows-x64,windows-arm64'

  deps:verify:
    desc: Show resolved native development tools.
    cmds:
      - '{{.MISE}} --version'
      - '{{.MISE}} exec -- task --version'
      - '{{.UV}} --version'
      - '{{.MISE}} exec -- node --version'
      - '{{.MISE}} which task'
      - '{{.MISE}} which uv'
      - '{{.MISE}} which node'

  deps:versions:
    desc: Report selected native and agent tool versions.
    cmds:
      - task: deps:verify
      - '{{.MISE}} ls --current'
      - '{{.PYTHON}} scripts/manage_agent_tools.py --command versions --target {{.TARGET}} --output {{.OUTPUT}}'

  deps:check:
    desc: Report available native and agent tool updates.
    cmds:
      - '{{.MISE}} outdated'
      - '{{.PYTHON}} scripts/manage_agent_tools.py --command check --target {{.TARGET}} --output {{.OUTPUT}}'

  tools:install:
    desc: Install pinned Serena, ast-grep, GitNexus, and local cq.
    cmds:
      - task: deps:tools
      - '{{.PYTHON}} scripts/manage_agent_tools.py --command install --target {{.TARGET}} --output {{.OUTPUT}}'

  agents:configure:
    desc: Merge supported host integrations while preserving existing configuration.
    cmds:
      - '{{.PYTHON}} scripts/manage_agent_tools.py --command configure --target {{.TARGET}} --output {{.OUTPUT}}'

  tools:lock:
    desc: Refresh the npm lock and Serena's dependency constraints after changing pins.
    cmd: '{{.PYTHON}} scripts/manage_agent_tools.py --command lock --output {{.OUTPUT}}'

  tools:run:
    desc: Run a local agent tool in the caller's project or worktree.
    requires:
      vars:
        - name: TOOL
          enum: [serena, ast-grep, gitnexus, cq]
    cmd: '{{.PYTHON}} scripts/manage_agent_tools.py --command run --tool {{.TOOL}} -- {{.CLI_ARGS}}'

  doctor:
    desc: Report native and agent tool versions and host configuration state.
    cmds:
      - task: deps:verify
      - '{{.PYTHON}} scripts/manage_agent_tools.py --command doctor --target {{.TARGET}} --output {{.OUTPUT}}'

  install:
    desc: Install the complete personal agent environment in order.
    cmds:
      - task: deps:install
      - task: tools:install
      - task: skills:install
      - task: agents:configure
      - task: doctor

  install:dry-run:
    desc: Preview agent tools, skills, and configuration without installing them.
    cmds:
      - '{{.PYTHON}} scripts/manage_agent_tools.py --command preview --target {{.TARGET}} --output {{.OUTPUT}}'
      - '{{.PYTHON}} scripts/install_skills.py --target {{.TARGET}} --dry-run --locked --output {{.OUTPUT}}'

  test:
    desc: Run piw, setup-script, and agent launcher tests without live Docker Sandboxes.
    cmds:
      - task: piw:test
      - task: test:tooling
      - task: test:agent-launchers

  test:tooling:
    desc: Run the setup-script tests (agent config, skill installer, fake host); no network.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LLMS_REQUIRE_PINNED_TOOLS: '{{.REQUIRE_PINNED_TOOLS | default ""}}'
    cmd: '{{.PYTHON}} -m unittest tests.test_agent_setup tests.test_install_skills tests.test_fake_host tests.test_configure_end_to_end tests.test_windows_branches tests.test_install_powershell_modules tests.test_powershell_runners tests.test_ensure_mise_tools'

  test:agent-launchers:
    desc: Check pinned GitNexus launchers and emitted refresh commands.
    env:
      LLMS_REQUIRE_PINNED_TOOLS: '{{.REQUIRE_PINNED_TOOLS | default ""}}'
    cmd: '{{.MISE}} exec -- node --test tests/gitnexus-launchers.test.mjs'

  lint:python:
    desc: Run ruff and pyright on the Python outside piw; needs deps:dev-tools first.
    preconditions:
      - sh: '[ "$(cat "{{.ROOT_DIR}}/.tools/lint/requirements.txt")" = "$(cat "{{.ROOT_DIR}}/lint/requirements.txt")" ]'
        msg: Run `task deps:dev-tools` to install the lint tools.
      - sh: '"{{.LINT_BIN}}/ruff" --version && "{{.LINT_BIN}}/pyright" --version'
        msg: Run `task deps:dev-tools` to install the lint tools.
    dir: '{{.ROOT_DIR}}'
    # Pyright's PyPI wrapper must run its bundled pyright with the pinned nodejs-wheel-binaries
    # Node. Empty values switch off the variables that would make it download a pyright, a Node
    # or a Pylance-matched pyright; the folders keep anything it writes under .tools/lint.
    env:
      PYRIGHT_PYTHON_IGNORE_WARNINGS: '1'
      PYRIGHT_PYTHON_FORCE_VERSION: ''
      PYRIGHT_PYTHON_PYLANCE_VERSION: ''
      PYRIGHT_PYTHON_NODE_VERSION: ''
      PYRIGHT_PYTHON_USE_BUNDLED_PYRIGHT: '1'
      PYRIGHT_PYTHON_NODEJS_WHEEL: '1'
      PYRIGHT_PYTHON_GLOBAL_NODE: '0'
      PYRIGHT_PYTHON_ENV_DIR: '{{.ROOT_DIR}}/.tools/lint/pyright-env'
      PYRIGHT_PYTHON_CACHE_DIR: '{{.ROOT_DIR}}/.tools/lint/pyright-cache'
    cmds:
      - '"{{.LINT_BIN}}/ruff" --version'
      - '"{{.LINT_BIN}}/pyright" --version'
      - '"{{.LINT_BIN}}/ruff" check'
      - '"{{.LINT_BIN}}/ruff" format --check'
      - '"{{.LINT_BIN}}/pyright" --warnings -p lint/pyrightconfig.json'

  lint:shell:
    desc: Run shellcheck on bootstrap.sh and the other shell script; needs deps:dev-tools first.
    preconditions:
      - sh: '{{.MISE_LINT}} which shellcheck'
        msg: Run `task deps:dev-tools` to install shellcheck.
    cmds:
      - '{{.MISE_LINT}} exec -- shellcheck --version'
      - '{{.MISE_LINT}} exec -- shellcheck ../bootstrap.sh ../scripts/ensure_mise_tools.sh'

  lint:powershell:
    desc: Run PSScriptAnalyzer (with the Windows PowerShell 5.1 checks) on every tracked .ps1 file; needs deps:dev-tools first.
    preconditions:
      - sh: '{{.MISE_LINT}} which pwsh && [ -d "{{.ANALYZER_DIR}}" ]'
        msg: Run `task deps:dev-tools` to install PowerShell and PSScriptAnalyzer.
    dir: '{{.ROOT_DIR}}'
    env:
      # The runner imports the pinned module by its exact path. PSModulePath is not a fence:
      # PowerShell adds the user, shared and built-in module folders to it.
      PSModulePath: '{{.PSMODULES}}'
    cmd: '{{.MISE_LINT}} exec -- pwsh -NoProfile -File "{{.ROOT_DIR}}/lint/run_psscriptanalyzer.ps1"'

  test:powershell:
    desc: Run the Pester tests for bootstrap.ps1; needs deps:dev-tools first.
    preconditions:
      - sh: '{{.MISE_LINT}} which pwsh && [ -d "{{.PESTER_DIR}}" ]'
        msg: Run `task deps:dev-tools` to install PowerShell and Pester.
    dir: '{{.ROOT_DIR}}'
    env:
      PSModulePath: '{{.PSMODULES}}'
    cmd: '{{.MISE_LINT}} exec -- pwsh -NoProfile -File "{{.ROOT_DIR}}/lint/run_pester.ps1"'

  check:
    desc: Run every local check without installing anything; needs deps:dev-tools once first; fetches external skills.
    cmds:
      - task: piw:check
      - task: lint:python
      - task: lint:shell
      - task: lint:powershell
      - task: test:powershell
      # A task's env does not reach the tasks it calls, so the requirement travels as a variable.
      - task: skills:check
        vars: {REQUIRE_PINNED_TOOLS: '1'}
      - task: test:agent-launchers
        vars: {REQUIRE_PINNED_TOOLS: '1'}

  build:
    desc: Build all distributable repository artifacts.
    cmds:
      - task: piw:build

  ci:
    desc: Run check plus the piw package build and smoke test.
    cmds:
      - task: piw:ci
      - task: lint:python
      - task: lint:shell
      - task: lint:powershell
      - task: test:powershell
      - task: skills:check
        vars: {REQUIRE_PINNED_TOOLS: '1'}
      - task: test:agent-launchers
        vars: {REQUIRE_PINNED_TOOLS: '1'}

  skills:list:
    desc: List managed skills, dependencies, and resolved install targets.
    cmd: '{{.PYTHON}} scripts/install_skills.py --command list --target {{.TARGET}} --output {{.OUTPUT}}'

  skills:validate:
    desc: Validate managed skill folder shape, references, and metadata.
    cmd: '{{.PYTHON}} scripts/install_skills.py --command validate --output {{.OUTPUT}}'

  skills:check:
    desc: Fetch and validate the actual managed skill payloads.
    cmds:
      - task: skills:fetch
      - task: skills:validate
      - task: skills:test
        vars: {REQUIRE_PINNED_TOOLS: '{{.REQUIRE_PINNED_TOOLS | default ""}}'}

  skills:test:
    desc: Run skill script tests and every test under tests/, including setup and skill fixtures.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LLMS_REQUIRE_PINNED_TOOLS: '{{.REQUIRE_PINNED_TOOLS | default ""}}'
    cmds:
      - '{{.PYTHON}} -m unittest discover -s skills/clean-stale-worktrees/tests -p "test_*.py"'
      - '{{.PYTHON}} -m unittest discover -s tests -p "test_*.py"'

  skills:fetch:
    desc: Fetch and verify pinned external skills without installing live copies.
    cmd: '{{.PYTHON}} scripts/install_skills.py --command fetch --output {{.OUTPUT}}'

  skills:dry-run:
    desc: Show what skill installation would change for TARGET (default all).
    cmd: '{{.PYTHON}} scripts/install_skills.py --target {{.TARGET}} --dry-run --locked --output {{.OUTPUT}}'

  skills:dry-run:codex:
    desc: Show what the Codex skill installation would change.
    cmds:
      - task: skills:dry-run
        vars: {TARGET: codex}

  skills:dry-run:claude:
    desc: Show what the Claude skill installation would change.
    cmds:
      - task: skills:dry-run
        vars: {TARGET: claude}

  skills:dry-run:pi:
    desc: Show what the Pi skill installation would change.
    cmds:
      - task: skills:dry-run
        vars: {TARGET: pi}

  skills:dry-run:opencode:
    desc: Show what the OpenCode skill installation would change.
    cmds:
      - task: skills:dry-run
        vars: {TARGET: opencode}

  skills:install:
    desc: Install managed skills and the external skill commits recorded in agent-dependencies.json.
    cmd: '{{.PYTHON}} scripts/install_skills.py --target {{.TARGET}} --locked --output {{.OUTPUT}}'

  skills:update:
    desc: Move external skills to upstream's latest commit, record it in agent-dependencies.json, and install.
    cmd: '{{.PYTHON}} scripts/install_skills.py --target {{.TARGET}} --output {{.OUTPUT}}'

  skills:install:codex:
    desc: Install managed and required external skills for Codex.
    cmds:
      - task: skills:install
        vars: {TARGET: codex}

  skills:install:claude:
    desc: Install managed and required external skills for Claude.
    cmds:
      - task: skills:install
        vars: {TARGET: claude}

  skills:install:pi:
    desc: Install managed and required external skills for Pi.
    cmds:
      - task: skills:install
        vars: {TARGET: pi}

  skills:install:opencode:
    desc: Install managed and required external skills for OpenCode.
    cmds:
      - task: skills:install
        vars: {TARGET: opencode}
