version: '3'

silent: true

includes:
  piw:
    taskfile: ./piw/Taskfile.yml
    dir: ./piw

tasks:
  default:
    desc: List available repository tasks.
    cmd: '{{.TASK_EXE}} --list'

  setup:
    desc: Install pinned tools and synchronize project dependencies.
    cmds:
      - mise install --locked
      - task: piw:sync

  test:
    desc: Run all deterministic repository tests.
    cmds:
      - task: piw:test
      - task: skills:test

  check:
    desc: Run the full nonmutating local quality gate.
    cmds:
      - task: piw:check
      - task: skills:check

  build:
    desc: Build all distributable repository artifacts.
    cmds:
      - task: piw:build

  ci:
    desc: Reproduce the complete CI gate locally.
    cmds:
      - task: piw:ci
      - task: skills:check

  skills:list:
    desc: List managed skills and resolved install targets.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --command list

  skills:validate:
    desc: Validate managed skill folder shape and metadata.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --command validate

  skills:check:
    desc: Validate managed skills and run installer tests.
    cmds:
      - task: skills:validate
      - task: skills:test

  skills:test:
    desc: Run the installer unit tests.
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - uv run --isolated --python 3.14 python -m unittest discover -s tests -p "test_*.py"

  skills:dry-run:
    desc: Show what skill installation would change.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --target all --dry-run

  skills:dry-run:codex:
    desc: Show what the Codex skill installation would change.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --target codex --dry-run

  skills:dry-run:pi:
    desc: Show what the Pi skill installation would change.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --target pi --dry-run

  skills:install:
    desc: Install managed skills for Codex, Claude, and Pi.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --target all

  skills:install:codex:
    desc: Install managed skills for Codex only.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --target codex

  skills:install:claude:
    desc: Install managed skills for Claude only.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --target claude

  skills:install:pi:
    desc: Install managed skills for Pi only.
    cmds:
      - uv run --isolated --python 3.14 python scripts/install_skills.py --target pi
