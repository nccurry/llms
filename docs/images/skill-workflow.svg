    <text x="40" y="82" fill="#f5f8ff" font-size="28" font-weight="700">From a question to delivered work</text>
    <text x="40" y="110" fill="#b6c5d8" font-size="16">Pick the steps your task needs. Keep the plan current as you go.</text>

