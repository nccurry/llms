<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title description">
  <title id="title">From a question to delivered work</title>
  <desc id="description">Six steps: investigate, plan, review the plan, build selected work, audit and repair, then deliver and clean up. Plain English, clear design, and verified claims apply throughout. Small fixes can skip the planning steps.</desc>
